defaults:
  - train_past2next_finetune
  - _self_

name: train_past2next_finetune_all500

# Final refinement on every supplied human demonstration. The former 50-episode
# offline validation split becomes training data; no held-out loss is reported.
# Benchmark simulator episodes and reserved final evaluation seeds stay separate.
policy:
  self_past_temperature: 1.0
  obs_encoder:
    vision_encoder:
      crop_shape: [112, 112]

task:
  policy:
    lazy_eval: true
    dataset:
      val_ratio: 0.0
      max_train_episodes: null

training:
  resume: false
  init_checkpoint: output/training/015_finetune112_greedy_history/checkpoints/ep-0009.ckpt
  init_weights: ema
  # Source and target already use crop112; no spatial buffer adaptation needed.
  init_allow_spatial_resize: false
  num_epochs: 10
  snapshot_every: 1
  offline_validation_enabled: false
  offline_validation_reason: all_500_supplied_demonstrations_are_training_data_no_offline_holdout

optimizer:
  policy_lr: 1.0e-5
  obs_enc_lr: 1.0e-5

checkpoint:
  topk:
    k: 0
