defaults:
  - task/policy: libero/libero10_with_prev_window
  - _self_

name: train_past2next_scratch_all500
_target_: oat.workspace.train_policy.TrainPolicyWorkspace

# 043 design: fresh policy/vision weights real robotic scenarios

seed: 42
horizon: 16
n_action_steps: 8
n_obs_steps: 2
past_n: 7
task_name: ${task.policy.name}
shape_meta: ${task.policy.shape_meta}

policy:
  _target_: oat.policy.past2next_self_past.Past2NextSelfPastPolicy
  shape_meta: ${shape_meta}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}
  past_n: ${past_n}
  obs_encoder:
    _target_: oat.perception.fused_obs_encoder.FusedObservationEncoder
    _recursive_: False
    shape_meta: ${shape_meta}
    vision_encoder:
      _target_: oat.perception.robomimic_vision_encoder.RobomimicRgbEncoder
      crop_shape: [112, 112]
      eval_fixed_crop: True  # Random training crops; center crops in eval/inference.
    state_encoder:
      _target_: oat.perception.state_encoder.ProjectionStateEncoder
      out_dim: null
  action_tokenizer:
    _target_: oat.tokenizer.oat.tokenizer.OATTok.from_checkpoint
    checkpoint: ???  # Stage 1 tokenizer checkpoint; required for Stage 2.
  embed_dim: 256
  n_layers: 8
  n_heads: 8
  dropout: 0.1
  temperature: 0.0
  topk: 10
  self_past_p: 0.5
  self_past_warmup_steps: 1000
  self_past_temperature: 1.0
  self_past_topk: 10
  self_past_schedule: optimizer_step
  self_past_ramp_steps: 4000

training:
  resume: False
  allow_bf16: True
  max_grad_norm: 1.0
  num_epochs: 251
  val_every: 1
  sample_every: 1
  rollout_every: 25
  checkpoint_every: 25
  lr_scheduler: cosine
  lr_warmup_steps: 100
  gradient_accumulate_every: 1
  max_train_steps: null
  max_val_steps: null
  max_reconst_steps: 10
  seed: ${seed}
  use_ema: True
  num_demo: 500
  tqdm_interval_sec: 1.0
  init_checkpoint: null
  snapshot_every: 25
  validate_generated_history: True
  # offline_validation_enabled: False
  offline_validation_enabled: True
  offline_validation_reason: all_500_supplied_demonstrations_are_training_data_no_offline_holdout

ema:
  _target_: oat.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

optimizer:
  policy_lr: 1.0e-05
  obs_enc_lr: 1.0e-05
  weight_decay: 0.0001
  betas: [0.9, 0.95]

dataloader:
  batch_size: 64
  num_workers: 4
  shuffle: True
  pin_memory: True
  persistent_workers: True
  drop_last: True

val_dataloader:
  batch_size: 64
  num_workers: 2
  shuffle: False
  pin_memory: True
  persistent_workers: True
  drop_last: False

task:
  policy:
    lazy_eval: True
    dataset:
      history_padding: zero
      return_history_validity: True
      # val_ratio: 0.0
      val_ratio: 0.1
      max_train_episodes: null
    env_runner:
      protocol: corrected
      n_test: 100
      n_test_vis: 0
      n_parallel_envs: 10

logging:
  project: oat_dev
  resume: False
  mode: offline
  name: ${now:%Y%m%d.%H%M%S}_${name}_${task_name}_N${training.num_demo}
  tags: ['${name}', '${task_name}']
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: mean_success_rate
    mode: max
    k: 0
    format_str: ep-{epoch:04d}_sr-{mean_success_rate:.3f}.ckpt
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: output/${now:%Y%m%d}/${now:%H%M%S}_${name}_${task_name}_N${training.num_demo}
  wandb_name_base: ${now:%Y%m%d.%H%M%S}_${name}_${task_name}_N${training.num_demo}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: output/${now:%Y%m%d}/${now:%H%M%S}_${name}_${task_name}_N${training.num_demo}
  sweep:
    dir: output/${now:%Y%m%d}/${now:%H%M%S}_${name}_${task_name}_N${training.num_demo}
    subdir: ${hydra.job.num}
