# Additive original-fused recipe. No DINO, ConvNeXt or Resampler fields.
defaults:
- task/policy: libero/libero10_with_prev_window
- _self_
name: train_p2n_new_original_obs
variant: p2n_new
task_type: libero
_target_: oat.workspace.train_p2n_new_original_obs.TrainP2NNewOriginalObsWorkspace
seed: 42
horizon: 16
n_action_steps: 8
n_obs_steps: 2
past_n: 7
task_name: ${task.policy.name}
shape_meta: ${task.policy.shape_meta}
policy:
  _target_: oat.policy.p2n_new_original_obs.P2NNewOriginalObsPolicy
  variant: ${variant}
  task: ${task_type}
  shape_meta: ${shape_meta}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}
  past_n: ${past_n}
  horizon: ${horizon}
  construction_mode: fresh
  tokenizer_checkpoint: /workspace/models/libero10-oat-so3aug/547243abb8e93752589ff674121bf129eb7327d773c72818c27ed3b9aebb3325/ep-4330_mse-0.001.ckpt
  embed_dim: 768
  n_layers: 16
  n_heads: 12
  ffn_dim: 2048
  dropout: 0.1
  temperature: 0.0
  topk: 10
  activation_checkpointing: false
  self_past_p: 0.5
  self_past_warmup_steps: 1000
  self_past_ramp_steps: 4000
  self_past_schedule: optimizer_step
  self_past_chunk_size: 4
  self_past_temperature: 1.0
  self_past_topk: 10
  obs_encoder_type: original_fused
  context_layout: original_fused_v1
  context_schema_version: 2
  expected_action_tokens: 8
  original_obs_config:
    crop_shape:
    - 112
    - 112
    eval_fixed_crop: true
    use_group_norm: true
    share_rgb_model: false
    pretrained: false
    state_out_dim: null
    feature_dimension: 64
    spatial_softmax_num_kp: 32
    spatial_softmax_temperature: 1.0
    spatial_softmax_noise: 0.0
training:
  resume: false
  resume_checkpoint: null
  init_checkpoint: null
  allow_bf16: true
  max_grad_norm: 1.0
  num_epochs: 251
  val_every: 1
  sample_every: 1
  rollout_every: 25
  checkpoint_every: 25
  snapshot_every: 25
  lr_scheduler: cosine
  lr_warmup_steps: null
  lr_warmup_ratio: 0.05
  gradient_accumulate_every: 4
  max_train_steps: null
  max_val_steps: null
  max_reconst_steps: 10
  seed: ${seed}
  use_ema: true
  num_demo: 500
  tqdm_interval_sec: 1.0
  validate_generated_history: true
  offline_validation_enabled: true
  offline_validation_reason: held_out_libero_episodes
  validation_max_samples: null
ema:
  _target_: oat.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999
optimizer:
  policy_lr: 5.0e-05
  obs_enc_lr: 1.0e-05
  weight_decay: 0.01
  betas:
  - 0.9
  - 0.95
dataloader:
  batch_size: 8
  num_workers: 4
  shuffle: true
  pin_memory: true
  persistent_workers: true
  drop_last: true
val_dataloader:
  batch_size: 4
  num_workers: 2
  shuffle: false
  pin_memory: true
  persistent_workers: true
  drop_last: false
task:
  policy:
    lazy_eval: true
    dataset:
      history_padding: zero
      return_history_validity: true
      val_ratio: 0.1
      max_train_episodes: null
    env_runner:
      _target_: oat.env_runner.p2n_new_convnext_libero10_runner.P2NNewLiberoRunner
      protocol: corrected
      n_test: 100
      n_test_vis: 0
      n_parallel_envs: 10
logging:
  project: p2n_new_original_obs
  resume: false
  mode: online
  name: ${now:%Y%m%d.%H%M%S}_${variant}_original_obs_${task_name}_seed${seed}
  tags:
  - ${variant}
  - ${task_name}
  - original_fused
  id: null
  group: ${variant}_original_obs_${task_type}
checkpoint:
  topk:
    monitor_key: val_loss
    mode: min
    k: 0
    format_str: ep-{epoch:04d}_val-{val_loss:.6f}.ckpt
  save_last_ckpt: true
  save_last_snapshot: false
  save_all: false
hydra:
  run:
    dir: output/training/${variant}_original_obs_${task_type}_${now:%Y%m%d_%H%M%S}_seed${seed}
  job:
    chdir: false
