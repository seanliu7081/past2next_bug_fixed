defaults:
  - task/policy: libero/libero10_with_prev_window
  - _self_

name: train_p2n_latent_flow
policy_family: oat_latent_flow
variant: p2n_latent_flow
task_type: libero
_target_: oat.workspace.train_p2n_latent_flow.TrainP2NLatentFlowWorkspace
seed: 42
horizon: 16
n_action_steps: 8
n_obs_steps: 2
past_n: 7
task_name: ${task.policy.name}
shape_meta: ${task.policy.shape_meta}

policy:
  _target_: oat.policy.p2n_latent_flow.P2NLatentFlowPolicy
  variant: ${variant}
  task: ${task_type}
  shape_meta: ${shape_meta}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}
  past_n: ${past_n}
  horizon: ${horizon}
  construction_mode: fresh
  dino_path: null
  dino_revision: null
  tokenizer_checkpoint: null
  rgb_range: uint8
  image_brightness: 0.1
  image_contrast: 0.1
  num_visual_queries: 64
  resampler_depth: 2
  embed_dim: 768
  n_layers: 16
  n_heads: 12
  ffn_dim: 2048
  dropout: 0.0
  activation_checkpointing: true
  self_past_p: 0.5
  self_past_warmup_steps: 1000
  self_past_ramp_steps: 4000
  self_past_schedule: optimizer_step
  self_past_chunk_size: 2

  flow:
    latent_space: fsq_normalized_codes
    num_slots: 8
    code_dim: 5
    levels: [8, 5, 5, 5, 5]
    fm_fraction: 0.75
    ct_weight: 1.0
    fm_beta: [1.0, 1.5]
    fm_time_scale: 0.999
    ct_time_bins: 10
    teacher_dt_mode: same_relative_dt
    solver: euler
    inference_steps: 8
    self_past_steps: 8
    endpoint_projection: fsq_nearest_grid

training:
  resume: false
  resume_checkpoint: null
  init_checkpoint: null
  allow_bf16: true
  max_grad_norm: 1.0
  num_epochs: 251
  val_every: 1
  sample_every: 1
  rollout_every: 25
  checkpoint_every: 25
  snapshot_every: 25
  lr_scheduler: cosine
  lr_warmup_steps: null
  lr_warmup_ratio: 0.05
  gradient_accumulate_every: 8
  max_train_steps: null
  max_val_steps: null
  max_reconst_steps: null
  seed: ${seed}
  use_ema: true
  num_demo: 500
  tqdm_interval_sec: 1.0
  validate_generated_history: true
  offline_validation_enabled: true
  offline_validation_reason: held_out_libero_episodes

ema:
  _target_: oat.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

optimizer:
  policy_lr: 5.0e-5
  obs_enc_lr: 1.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.95]

dataloader:
  batch_size: 4
  num_workers: 4
  shuffle: true
  pin_memory: true
  persistent_workers: true
  drop_last: true

val_dataloader:
  batch_size: 4
  num_workers: 2
  shuffle: false
  pin_memory: true
  persistent_workers: true
  drop_last: false

task:
  policy:
    lazy_eval: true
    dataset:
      _target_: oat.dataset.latent_flow_dataset.LatentFlowZarrDatasetWithPrevWindow
      history_padding: zero
      return_history_validity: true
      val_ratio: 0.1
      max_train_episodes: null
    env_runner:
      _target_: oat.env_runner.p2n_latent_flow_runner.P2NLatentFlowLiberoRunner
      protocol: corrected
      n_test: 100
      n_test_vis: 0
      n_parallel_envs: 10

logging:
  project: p2n_latent_flow
  resume: false
  mode: offline
  name: ${now:%Y%m%d.%H%M%S}_${variant}_${task_name}_seed${seed}
  tags: ['${variant}', '${task_name}', 'dinov3_vits16']
  id: null
  group: ${variant}_${task_type}

checkpoint:
  topk:
    monitor_key: val_action_mse
    mode: min
    k: 3
    format_str: ep-{epoch:04d}_mse-{val_action_mse:.6f}.ckpt
  save_last_ckpt: true
  save_last_snapshot: false
  save_all: false

hydra:
  run:
    dir: output/training/${variant}_${task_type}_${now:%Y%m%d_%H%M%S}_seed${seed}
  job:
    chdir: false
