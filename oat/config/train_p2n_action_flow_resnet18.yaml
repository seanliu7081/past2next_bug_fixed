# Trainable original ResNet-18 + SpatialSoftmax; random initialization, no external weights.
defaults:
  - task/policy: libero/libero10_with_prev_window
  - _self_

name: train_p2n_action_flow_resnet18
policy_family: continuous_action_flow
variant: p2n_action_flow
task_type: libero
_target_: oat.workspace.train_p2n_action_flow_resnet18.TrainP2NActionFlowResNet18Workspace
seed: 42
horizon: 16
n_action_steps: 8
n_obs_steps: 2
past_n: 7
task_name: ${task.policy.name}
shape_meta: ${task.policy.shape_meta}

policy:
  _target_: oat.policy.p2n_action_flow_resnet18.P2NActionFlowResNet18Policy
  variant: ${variant}
  task: ${task_type}
  shape_meta: ${shape_meta}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}
  past_n: ${past_n}
  horizon: ${horizon}
  construction_mode: fresh
  obs_encoder_type: resnet18
  resnet_config:
    crop_shape: [112, 112]
    use_group_norm: true
    share_rgb_model: false
    eval_fixed_crop: true
  action_dim: 7
  action_schema: ${action_schema}
  embed_dim: 768
  n_layers: 16
  n_heads: 12
  dropout: 0.0
  activation_checkpointing: true
  self_past_p: 0.5
  self_past_warmup_steps: 1000
  self_past_ramp_steps: 4000
  self_past_schedule: optimizer_step
  self_past_chunk_size: 2

  flow:
    space: normalized_actions
    ffn_type: gelu
    ffn_hidden_dim: 3072
    self_qk_norm: false
    cross_qk_norm: layernorm
    qkv_bias: true
    time_embed_dim: 128
    global_condition: time_and_step_only
    pre_norm_modality: false
    fm_fraction: 0.75
    ct_weight: 1.0
    fm_beta: [1.0, 1.5]
    fm_time_scale: 0.999
    ct_time_bins: 10
    teacher_dt_mode: same_relative_dt
    solver: euler
    inference_steps: 8
    self_past_steps: 8
    output_transform: action_unnormalize
    loss_padding: supervise_edge_repeated_targets

normalization:
  source: training_replay_frames
  mode: limits
  refit_on_resume: false

action_schema:
  version: 1
  action_dim: 7
  horizon: ${horizon}
  execution_steps: ${n_action_steps}
  execution_anchor: current_observation_t
  control_frequency_hz: 20
  source: third_party/LIBERO/libero/libero/envs/env_wrapper.py
  translation:
    slice: [0, 3]
    representation: controller_delta_position
    frame: OSC_POSE_controller_frame
    units: normalized_controller_command
  rotation:
    slice: [3, 6]
    representation: controller_rotation_vector_delta
    frame: OSC_POSE_controller_frame
    units: normalized_controller_command
  gripper:
    index: 6
    representation: absolute_controller_command
    units: normalized_controller_command
    open: -1.0
    closed: 1.0
  gripper_observation:
    key: robot0_gripper_qpos
    representation: measured_joint_positions
    units: metres
  controller_postprocessing: external_LIBERO_OSC_POSE_controller

training:
  resume: false
  resume_checkpoint: null
  init_checkpoint: null
  allow_bf16: true
  max_grad_norm: 1.0
  num_epochs: 251
  val_every: 1
  sample_every: 1
  rollout_every: 25
  checkpoint_every: 20
  snapshot_every: 20
  lr_scheduler: cosine
  lr_warmup_steps: null
  lr_warmup_ratio: 0.05
  gradient_accumulate_every: 8
  max_train_steps: null
  max_val_steps: null
  max_reconst_steps: null
  seed: ${seed}
  use_ema: true
  num_demo: 500
  tqdm_interval_sec: 1.0
  validate_generated_history: true
  offline_validation_enabled: true
  offline_validation_reason: held_out_libero_episodes

ema:
  _target_: oat.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

optimizer:
  policy_lr: 5.0e-5
  obs_enc_lr: 1.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.95]

dataloader:
  batch_size: 4
  num_workers: 4
  shuffle: true
  pin_memory: true
  persistent_workers: true
  drop_last: true

val_dataloader:
  batch_size: 4
  num_workers: 2
  shuffle: false
  pin_memory: true
  persistent_workers: true
  drop_last: false

task:
  policy:
    lazy_eval: true
    dataset:
      _target_: oat.dataset.action_flow_dataset.ActionFlowZarrDatasetWithPrevWindow
      history_padding: zero
      return_history_validity: true
      val_ratio: 0.1
      max_train_episodes: null
    env_runner:
      _target_: oat.env_runner.p2n_action_flow_runner.P2NActionFlowLiberoRunner
      protocol: corrected
      n_test: 100
      n_test_vis: 0
      n_parallel_envs: 10

logging:
  project: p2n_action_flow_resnet18
  resume: false
  mode: online
  name: ${now:%Y%m%d.%H%M%S}_${variant}_resnet18_${task_name}_seed${seed}
  tags: ['${variant}', '${task_name}', 'resnet18']
  id: null
  group: ${variant}_resnet18_${task_type}

checkpoint:
  topk:
    monitor_key: val_action_mse
    mode: min
    k: 3
    format_str: ep-{epoch:04d}_mse-{val_action_mse:.6f}.ckpt
  save_last_ckpt: true
  save_last_snapshot: false
  save_all: false

hydra:
  run:
    dir: output/training/${variant}_resnet18_${task_type}_${now:%Y%m%d_%H%M%S}_seed${seed}
  job:
    chdir: false
