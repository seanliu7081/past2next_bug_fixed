# @package _global_
# Original observation encoder, trained from scratch; no DINO checkpoint required.
defaults:
  - /experimental/train_p2n_latent_flow_pen_cabinet
  - _self_

name: train_p2n_latent_flow_resnet18_pen_cabinet

policy:
  obs_encoder_type: resnet18
  image_brightness: 0.0
  image_contrast: 0.0
  num_visual_queries: null
  resampler_depth: null
  resnet_config:
    crop_shape: [112, 112]
    use_group_norm: true
    share_rgb_model: false
    eval_fixed_crop: true

logging:
  name: ${now:%Y%m%d.%H%M%S}_${variant}_resnet18_${task_name}_seed${seed}
  tags: ['${variant}', '${task_name}', 'resnet18']
  group: ${variant}_resnet18_pen_cabinet

hydra:
  run:
    dir: output/training/${variant}_resnet18_pen_cabinet_${now:%Y%m%d_%H%M%S}_seed${seed}
