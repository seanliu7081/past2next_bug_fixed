# @package _global_
# R3: R2 plus the measured-state history gate on a DexMimicGen task (Panda-dex keys by default;
# GR1 tasks override state_history_keys with the robot0_right_* / robot0_left_* ports).
defaults:
- /experimental/train_p2n_new_original_obs_dexmg
- _self_
name: train_p2n_state_gate_new_original_obs_dexmg
variant: p2n_state_gate_new
state_history_steps: 8
state_history_keys:
- robot0_eef_pos
- robot0_eef_rot6d
- robot0_gripper_qpos
- robot1_eef_pos
- robot1_eef_rot6d
- robot1_gripper_qpos
policy:
  _target_: oat.policy.p2n_new_original_obs.P2NStateGateNewOriginalObsPolicy
  state_history_steps: ${state_history_steps}
  state_history_keys: ${state_history_keys}
  history_embed_dim: 128
  history_n_heads: 4
  history_n_layers: 2
  history_summary_tokens: 4
  history_dropout: 0.1
  history_gate_mode: learned
  history_gate_hidden_dim: 128
  history_gate_init: 0.9
  rotation_6d_layout: rows
task:
  policy:
    dataset:
      _target_: oat.dataset.real_robot_state_history.RealRobotZarrDatasetWithStateHistory
      state_history_steps: ${state_history_steps}
      state_history_keys: ${state_history_keys}
    env_runner:
      _target_: oat.env_runner.dexmg_runner.P2NStateGateNewDexMGRunner
      state_history_steps: ${state_history_steps}
      state_history_keys: ${state_history_keys}
