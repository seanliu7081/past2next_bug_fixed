# @package _global_
defaults:
- /train_p2n_new_original_obs
- override /task/policy: real_robot/nut_washer_with_prev_window
- _self_
name: train_p2n_state_gate_new_original_obs_real_robot
variant: p2n_state_gate_new
task_type: real_robot
state_history_steps: 8
state_history_keys:
- robot0_eef_pos
- robot0_eef_rot6d
- robot0_gripper_qpos
policy:
  _target_: oat.policy.p2n_new_original_obs.P2NStateGateNewOriginalObsPolicy
  state_history_steps: ${state_history_steps}
  state_history_keys: ${state_history_keys}
  history_embed_dim: 128
  history_n_heads: 4
  history_n_layers: 2
  history_summary_tokens: 4
  history_dropout: 0.1
  history_gate_mode: learned
  history_gate_hidden_dim: 128
  history_gate_init: 0.9
  rotation_6d_layout: rows
  tokenizer_checkpoint: /workspace/ysk/past2next_bug_fixed/output/training/nut_washer_v3_N77_gated_so3aug_20260924_081008_317043427/tokenizer/checkpoints/ep-1540_mse-0.000.ckpt
task:
  policy:
    name: real_robot_nut_washer_v3_N77
    task_name: nut_washer_v3_N77
    lazy_eval: true
    env_runner: null
    dataset:
      _target_: oat.dataset.real_robot_state_history.RealRobotZarrDatasetWithStateHistory
      zarr_path: /workspace/ysk/zarr/nut_washer_v3_N77.zarr
      val_ratio: 0.05
      seed: 42
      state_history_steps: ${state_history_steps}
      state_history_keys: ${state_history_keys}
      history_padding: zero
      return_history_validity: true
training:
  num_demo: 77
  num_epochs: 2001
  checkpoint_every: 50
  snapshot_every: 50
  offline_validation_reason: held_out_nut_washer_v3_N77_episodes
logging:
  project: real_robot_p2n_new_original_obs
