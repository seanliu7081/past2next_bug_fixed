# @package _global_
# Dataset/schema: task/policy/real_robot/fruits_with_prev_window.yaml.
# Keep the direct action-flow real-robot recipe, including 2001 epochs.
defaults:
  - /experimental/train_p2n_action_flow_resnet18_real_robot
  - override /task/policy: real_robot/fruits_with_prev_window
  - _self_

name: train_p2n_action_flow_resnet18_fruits

training:
  num_demo: 51
  offline_validation_reason: held_out_fruits_N51_episodes

task:
  policy:
    name: real_robot_fruits
    task_name: fruits
    dataset:
      zarr_path: /workspace/ysk/zarr/fruits_N51.zarr
      val_ratio: 0.1

logging:
  group: ${variant}_resnet18_fruits
