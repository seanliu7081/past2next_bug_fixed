# Adapted from past2next_clean/oat/config/train_diffpolicy.yaml.
# One-stage diffusion training: no action tokenizer or past-action windows.
defaults:
  - task/policy: real_robot/diffpolicy
  - _self_

name: train_diffpolicy_real_robot
_target_: oat.workspace.train_policy.TrainPolicyWorkspace

seed: 42
dataset_name: pen_cabinet_lp3_N67
dataset_path: /workspace/ysk/zarr/${dataset_name}.zarr
horizon: 16
n_action_steps: 8
n_obs_steps: 2
task_name: ${task.policy.name}
shape_meta: ${task.policy.shape_meta}

policy:
  _target_: oat.policy.diffpolicy.DiffusionTransformerPolicy
  shape_meta: ${shape_meta}
  horizon: ${horizon}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}
  obs_encoder:
    _target_: oat.perception.fused_obs_encoder.FusedObservationEncoder
    _recursive_: false
    shape_meta: ${shape_meta}
    vision_encoder:
      _target_: oat.perception.robomimic_vision_encoder.RobomimicRgbEncoder
      crop_shape: [112, 112]
      eval_fixed_crop: true
    state_encoder:
      _target_: oat.perception.state_encoder.ProjectionStateEncoder
      out_dim: null

  # Preserve the source diffusion transformer and DDIM settings.
  embed_dim: 256
  n_layers: 4
  n_heads: 4
  dropout: 0.1
  num_inference_steps: 10
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddim.DDIMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: true
    set_alpha_to_one: true
    steps_offset: 0
    prediction_type: epsilon

training:
  resume: false
  init_checkpoint: null
  allow_bf16: true
  max_grad_norm: 1.0
  num_epochs: 1001
  val_every: 10
  sample_every: 10
  rollout_every: 200
  checkpoint_every: 50
  snapshot_every: 0
  lr_scheduler: constant
  lr_warmup_steps: 200
  gradient_accumulate_every: 1
  max_train_steps: null
  max_val_steps: null
  max_reconst_steps: 10
  seed: ${seed}
  use_ema: true
  num_demo: 67
  tqdm_interval_sec: 1.0
  offline_validation_enabled: true
  offline_validation_reason: held_out_real_robot_episodes

ema:
  _target_: oat.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

optimizer:
  policy_lr: 5.0e-5
  obs_enc_lr: 1.0e-5
  weight_decay: 0.0
  betas: [0.9, 0.95]

dataloader:
  batch_size: 64
  num_workers: 4
  shuffle: true
  pin_memory: true
  persistent_workers: true
  drop_last: true

val_dataloader:
  batch_size: 32
  num_workers: 2
  shuffle: false
  pin_memory: true
  persistent_workers: true
  drop_last: false

logging:
  project: real_robot
  resume: false
  mode: online
  name: ${now:%Y%m%d.%H%M%S}_${name}_${task_name}_N${training.num_demo}
  tags: [diffusion_policy, real_robot, '${dataset_name}']
  id: null
  group: ${dataset_name}_diffpolicy

checkpoint:
  topk:
    monitor_key: test_reconst_mse
    mode: min
    k: 3
    format_str: 'ep-{epoch:04d}_mse-{test_reconst_mse:.6f}.ckpt'
  save_last_ckpt: true
  save_last_snapshot: false

multi_run:
  run_dir: output/${now:%Y%m%d}/${now:%H%M%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y%m%d.%H%M%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: output/${now:%Y%m%d}/${now:%H%M%S}_${name}_${task_name}
  sweep:
    dir: output/${now:%Y%m%d}/${now:%H%M%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
