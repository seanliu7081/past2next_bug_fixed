defaults:
  - train_past2next_finetune
  - _self_

name: train_past2next_finetune_tasklr

# Checkpoint015 ep9 provides crop112 visual/policy weights. A zero categorical
# table preserves its initial predictions; only that table gets the faster LR.
policy:
  _target_: oat.policy.past2next_task_lr.Past2NextSelfPastTaskLRPolicy
  self_past_temperature: 1.0
  self_past_warmup_steps: 1000
  self_past_ramp_steps: 4000
  obs_encoder:
    _target_: oat.perception.task_residual_fused_obs_encoder.TaskResidualFusedObservationEncoder
    vision_encoder:
      crop_shape: [112, 112]

training:
  init_checkpoint: output/training/015_finetune112_greedy_history/checkpoints/ep-0009.ckpt
  init_weights: ema
  init_allow_spatial_resize: false
  resume: false
  num_epochs: 10
  snapshot_every: 1
  max_val_steps: null

optimizer:
  policy_lr: 1.0e-5
  obs_enc_lr: 2.0e-6
  task_residual_lr: 1.0e-3
