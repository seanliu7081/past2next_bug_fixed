defaults:
  - train_p2n_action_flow_resnet18
  - _self_

name: train_p2n_state_gate_action_flow_resnet18
variant: p2n_state_gate_action_flow
state_history_steps: 8
state_history_keys: [robot0_eef_pos, robot0_eef_quat, robot0_gripper_qpos]

policy:
  _target_: oat.policy.p2n_state_gate_action_flow_resnet18.P2NStateGateActionFlowResNet18Policy
  state_history_steps: ${state_history_steps}
  state_history_keys: ${state_history_keys}
  history_embed_dim: 128
  history_n_heads: 4
  history_n_layers: 2
  history_summary_tokens: 4
  history_dropout: 0.0
  history_gate_mode: learned
  history_gate_hidden_dim: 128
  history_gate_init: 0.9
  rotation_6d_layout: rows

task:
  policy:
    dataset:
      _target_: oat.dataset.action_flow_dataset.ActionFlowZarrDatasetWithStateHistory
      state_history_steps: ${state_history_steps}
      state_history_keys: ${state_history_keys}
    env_runner:
      _target_: oat.env_runner.p2n_action_flow_runner.P2NStateGateActionFlowLiberoRunner
      state_history_steps: ${state_history_steps}
      state_history_keys: ${state_history_keys}
