# Vision/action fine-tuning with the measured-state P2N gate.
defaults:
  - train_p2n_vla_vision_action
  - override task/policy: libero/libero10_vla_state_history
  - _self_

name: train_p2n_vla_state_gate_vision_action
variant: p2n_vla_state_gate

policy:
  _target_: oat.policy.p2n_vla_vision_action.P2NVLAStateGateVisionActionPolicy
  state_history_steps: ${task.policy.state_history_steps}
  state_history_keys: ${task.policy.state_history_keys}
  history_embed_dim: 128
  history_n_heads: 4
  history_n_layers: 2
  history_summary_tokens: 4
  history_dropout: 0.1
  history_gate_mode: learned
  history_gate_hidden_dim: 128
  history_gate_init: 0.9
  rotation_6d_layout: rows
  gate_state_dim: 256
